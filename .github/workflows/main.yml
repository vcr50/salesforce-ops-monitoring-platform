name: SentinelFlow CI/CD Pipeline

run-name: SentinelFlow CI/CD - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - master
      - 'codex-*'
      - 'feature/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  docs-check:
    name: Docs / Workflow Sanity Check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Lightweight Check
        run: |
          echo "SentinelFlow CI/CD workflow is running successfully."
          echo "Branch: ${{ github.ref_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
