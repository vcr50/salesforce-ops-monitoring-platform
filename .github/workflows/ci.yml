name: Tomcodex CI

run-name: Tomcodex CI - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - master
      - 'codex-*'
      - 'feature/*'
      - codex-sentinelflow-marketing-zentom-bot
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - 'codex-*'
      - 'feature/*'
      - codex-sentinelflow-marketing-zentom-bot
  workflow_dispatch:

concurrency:
  group: tomcodex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Docs / Workflow Sanity Check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow is active
        run: |
          echo "GitHub Actions workflow is running successfully."
          echo "Branch: ${{ github.ref_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
