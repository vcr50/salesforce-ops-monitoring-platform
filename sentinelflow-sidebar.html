<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelFlow Command Center - Sidebar Component Template</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8' },
                        navy: { 900:'#0a1628',800:'#0f1f3d',700:'#111d35' }
                    }
                }
            }
        }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #0a0e1a; min-height: 100vh; display: flex; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: linear-gradient(180deg, #0c1929 0%, #0f1f3d 35%, #111d35 65%, #0a1628 100%);
            position: relative; overflow: hidden;
            width: 260px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border-right: 1px solid rgba(56, 189, 248, 0.1);
        }
        .sidebar::before {
            content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(56,189,248,0.07) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.05) 0%, transparent 50%);
            animation: aurora 15s ease-in-out infinite alternate; pointer-events:none;
        }
        @keyframes aurora {
            0%{transform:translate(0,0) rotate(0deg)} 50%{transform:translate(-5%,3%) rotate(1deg)} 100%{transform:translate(3%,-5%) rotate(-1deg)}
        }
        .particle { position:absolute; border-radius:50%; opacity:0; animation:float 10s ease-in-out infinite; pointer-events:none; }
        .particle:nth-child(1){width:3px;height:3px;background:rgba(56,189,248,0.35);left:15%;top:25%;animation-delay:0s;animation-duration:10s}
        .particle:nth-child(2){width:2px;height:2px;background:rgba(139,92,246,0.4);left:75%;top:45%;animation-delay:2s;animation-duration:12s}
        .particle:nth-child(3){width:4px;height:4px;background:rgba(56,189,248,0.2);left:50%;top:70%;animation-delay:4s;animation-duration:9s}
        .particle:nth-child(4){width:2px;height:2px;background:rgba(244,114,182,0.3);left:30%;top:85%;animation-delay:6s;animation-duration:11s}
        .particle:nth-child(5){width:3px;height:3px;background:rgba(34,211,238,0.25);left:85%;top:15%;animation-delay:3s;animation-duration:13s}
        @keyframes float {
            0%,100%{opacity:0;transform:translateY(0) scale(1)} 20%{opacity:1} 50%{opacity:.8;transform:translateY(-30px) scale(1.4)} 80%{opacity:.3}
        }
        .snav {
            display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:12px; cursor:pointer;
            position:relative; transition:all .3s cubic-bezier(.4,0,.2,1); color:rgba(148,163,184,.9);
            font-weight:600; font-size:13.5px; overflow:hidden; text-decoration:none;
        }
        .snav::before {
            content:''; position:absolute; inset:0; border-radius:12px; opacity:0;
            background:linear-gradient(135deg,rgba(56,189,248,.08),rgba(139,92,246,.06));
            backdrop-filter:blur(8px); transition:opacity .3s ease;
        }
        .snav:hover::before{opacity:1} .snav:hover{color:#e2e8f0;transform:translateX(4px)}
        .snav:hover .sicon{color:#38bdf8;filter:drop-shadow(0 0 4px rgba(56,189,248,.4))}
        .sicon{width:20px;height:20px;flex-shrink:0;transition:all .3s ease;color:rgba(100,116,139,.7);position:relative;z-index:1}
        .snav span{position:relative;z-index:1}
        
        .snav-active {
            color:#fff!important;
            background:linear-gradient(135deg,rgba(37,99,235,.85),rgba(79,70,229,.7));
            box-shadow:0 4px 20px rgba(37,99,235,.35),0 0 40px rgba(79,70,229,.12),inset 0 1px 0 rgba(255,255,255,.1);
            border:1px solid rgba(96,165,250,.25);
        }
        .snav-active::before{display:none} .snav-active:hover{transform:translateX(0)}
        .snav-active .sicon{color:white!important;filter:drop-shadow(0 0 6px rgba(255,255,255,.3))!important;animation:iconPulse 3s ease-in-out infinite}
        @keyframes iconPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,.2))}50%{filter:drop-shadow(0 0 10px rgba(255,255,255,.5))}}
        .snav-active::after {
            content:''; position:absolute; left:0; top:20%; bottom:20%; width:3px;
            border-radius:0 4px 4px 0; background:linear-gradient(180deg,#38bdf8,#818cf8);
            box-shadow:0 0 12px rgba(56,189,248,.6);
        }
        .badge-glow{animation:badgePulse 2s ease-in-out infinite}
        @keyframes badgePulse{0%,100%{box-shadow:0 0 4px rgba(239,68,68,.3)}50%{box-shadow:0 0 12px rgba(239,68,68,.6),0 0 24px rgba(239,68,68,.2)}}
        
        .ssub {
            display:flex;align-items:center;gap:10px;padding:8px 14px 8px 46px;cursor:pointer;
            color:rgba(100,116,139,.65);font-weight:600;font-size:13px;border-radius:8px;
            transition:all .25s ease;position:relative;text-decoration:none;
        }
        .ssub::before{content:'';position:absolute;left:30px;top:50%;width:6px;height:1px;background:rgba(100,116,139,.3);transition:all .25s ease}
        .ssub:hover{color:#cbd5e1;background:rgba(56,189,248,.05)} .ssub:hover::before{width:10px;background:rgba(56,189,248,.5)}
        
        .ssub-active {
            color:#fff!important;
            background:rgba(56,189,248,.08);
            border-left:2px solid #38bdf8;
            border-radius:0 8px 8px 0;
        }
        .ssub-active::before { width:10px; background:#38bdf8; }
        .sep{height:1px;margin:12px 16px;background:linear-gradient(90deg,transparent,rgba(56,189,248,.15),rgba(139,92,246,.1),transparent)}
        .slabel{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:rgba(100,116,139,.4);padding:0 14px;margin-bottom:8px}
        
        .glass{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(12px);border-radius:14px;padding:12px 14px;cursor:pointer;transition:all .3s ease}
        .glass:hover{background:rgba(255,255,255,.06);border-color:rgba(56,189,248,.15);box-shadow:0 4px 20px rgba(0,0,0,.2)}

        /* Mascot Container */
        .mascot-container {
            position: relative;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.5), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .mascot-glow {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
            top: -20px; left: -20px;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }
        @keyframes pulse-glow { 0% { transform: scale(1); opacity:0.5; } 100% { transform: scale(1.3); opacity:0.9; } }

        /* Focus Outlines */
        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #3b82f6 !important;
            outline-offset: 2px !important;
        }
    </style>
</head>
<body>

    <!-- Standalone Sidebar Wrapper -->
    <aside class="sidebar">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>

        <!-- Sidebar Header Brand -->
        <div style="padding:20px 16px 16px;position:relative;z-index:1">
            <div class="glass">
                <div style="display:flex;align-items:center;gap:12px">
                    <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(59,130,246,.3)">
                        <svg style="width:18px;height:18px;color:white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <div>
                        <div style="display:flex;align-items:center;gap:0.35rem;">
                            <span style="font-size:14px;font-weight:800;color:#e2e8f0">SentinelFlow</span>
                            <span style="font-size:9px;font-weight:700;color:#38bdf8;background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.2);padding:1px 5px;border-radius:4px;line-height:1">v1.1.0</span>
                        </div>
                        <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:3px">Powered by Zentom AI</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav style="flex:1;overflow-y:auto;padding:4px 12px;position:relative;z-index:1" class="scrollbar-hide">
            <div class="slabel" style="margin-top:4px">Main</div>
            <a href="#" class="snav snav-active" style="margin-bottom:4px">
                <svg class="sicon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="#" class="snav" style="margin-bottom:4px">
                <svg class="sicon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span>Incidents</span>
            </a>
            <a href="#" class="snav" style="margin-bottom:2px; justify-content:space-between">
                <div style="display:flex;align-items:center;gap:12px">
                    <svg class="sicon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>Approvals</span>
                </div>
                <span class="badge-glow" style="background:linear-gradient(135deg,#ef4444,#f97316);color:white;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;position:relative;z-index:1">3</span>
            </a>
            <a href="#" class="ssub" style="margin-bottom:2px">Actions</a>
            <a href="#" class="ssub" style="margin-bottom:4px">Runbooks</a>
            
            <div class="sep"></div>
            <div class="slabel">Governance</div>
            <a href="#" class="snav" style="margin-bottom:4px">
                <svg class="sicon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                <span>Policies</span>
            </a>
            <a href="#" class="snav" style="margin-bottom:4px">
                <svg class="sicon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <span>Cases</span>
            </a>
            
            <div class="sep"></div>
            <div class="slabel">Insights</div>
            <a href="#" class="snav" style="margin-bottom:4px">
                <svg class="sicon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
                <span>Reports</span>
            </a>
            <a href="#" class="snav" style="margin-bottom:4px">
                <svg class="sicon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>Integrations</span>
            </a>
            
            <div class="sep"></div>
            <a href="#" class="snav">
                <svg class="sicon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span>Settings</span>
            </a>
        </nav>

        <!-- Mascot Co-Pilot Box -->
        <div class="px-4 mb-2" style="position:relative;z-index:1;">
            <div class="mascot-container">
                <div class="mascot-glow"></div>
                <!-- Mascot Robot Head SVG -->
                <svg class="w-9 h-9 text-sky-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m18 0h-2M5 15H3m18 0h-2M6 7h12a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2V9a2 2 0 012-2z"/>
                    <circle cx="9" cy="12" r="1.5" fill="currentColor"></circle>
                    <circle cx="15" cy="12" r="1.5" fill="currentColor"></circle>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 15h6"/>
                </svg>
                <span style="font-size:11px;font-weight:800;color:#e2e8f0;">Zentom Co-Pilot</span>
                <span style="font-size:9px;color:#64748b;margin-top:2px;">Online & Ready</span>
            </div>
        </div>

        <!-- Sidebar Footer Org Detail -->
        <div style="padding:16px;position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.04)">
            <div class="glass">
                <div style="display:flex;align-items:center;justify-content:space-between">
                    <div style="display:flex;align-items:center;gap:10px">
                        <div style="width:30px;height:30px;border-radius:8px;background:rgba(56,189,248,.1);display:flex;align-items:center;justify-content:center">
                            <svg style="width:14px;height:14px;color:#38bdf8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                        </div>
                        <div>
                            <div style="font-size:12px;font-weight:700;color:#cbd5e1;line-height:1">Salesforce Org</div>
                            <div style="font-size:10px;color:rgba(100,116,139,.6);margin-top:4px;font-weight:500">Acme Corporation</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </aside>

</body>
</html>
